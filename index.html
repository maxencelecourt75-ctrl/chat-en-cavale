  --sp-eyes-box:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%226%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23FFF7B0%22/%3E%3Crect%20x%3D%229%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23FFF7B0%22/%3E%3Crect%20x%3D%226%22%20y%3D%2211%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23FFD233%22/%3E%3Crect%20x%3D%229%22%20y%3D%2211%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23FFD233%22/%3E%3C/svg%3E");
  --fl:var(--sp-floor); --fl-alt:var(--sp-floor-alt);
  /* Système UI */
  --bg:#0A0A0A; --surface:#121212; --surface-2:#0E0E0E; --line:#262626; --line-2:#333;
  --text:#ECECEC; --muted:#8A8A8A; --dim:#5C5C5C;
  --primary:#FFD25A; --primary-dk:#B8862A; --primary-ink:#1A1200;
  --success:#7BD389; --danger:#FF5A5A; --flame:#FF9A3C;
  --sight:rgba(255,90,90,.28); --alert:rgba(255,60,60,.5);
  --fs-xs:8px; --fs-sm:10px; --fs-md:12px; --fs-lg:16px; --fs-xl:22px;
  --sp:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --fl:var(--sp-floor-dark); --fl-alt:var(--sp-floor-dark-alt); }
}
:root[data-theme="dark"]{ --fl:var(--sp-floor-dark); --fl-alt:var(--sp-floor-dark-alt); }
*{box-sizing:border-box}
html,body{height:100%;margin:0;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Press Start 2P","Courier New",monospace;color:var(--text);background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:12px;font-size:var(--fs-sm)}
b{font-weight:400}

/* Fenêtre */
.window{position:relative;width:100%;max-width:420px;background:var(--surface);border:2px solid var(--line)}
.bar{display:flex;align-items:center;gap:var(--sp);padding:var(--sp) 10px;border-bottom:2px solid var(--line);min-height:44px}
.top{background:var(--surface-2);min-height:52px}
.top .lvl{flex:1;justify-content:center}
.lvlname{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:96px}
.lvlname #place{font-size:var(--fs-xs);color:var(--muted)}
.lvlname b{font-size:var(--fs-md);color:var(--text)}
.chips{display:flex;align-items:center;gap:12px}
.acts{display:flex;gap:6px}
.ico.menu{background-image:var(--ico-menu)}
.ico.left{background-image:var(--ico-left)}
.ico.right{background-image:var(--ico-right)}
.ico.check{background-image:var(--ico-check)}
.ico.heart{background-image:var(--ico-heart)}
.ico.son{background-image:var(--ico-son)}
.ico.mon{background-image:var(--ico-mon)}
.ico.moff{background-image:var(--ico-moff)}
.ico.soff{background-image:var(--ico-soff)}
.ico.heart.off{filter:grayscale(1) brightness(.35)}
#lives{display:inline-flex;gap:3px}
.status{gap:10px}
@media (max-width:420px){.movebar .lbl{display:none}#pips .ico{width:12px;height:12px}#lives .ico{width:12px;height:12px}}
.hearts{display:flex;justify-content:center;gap:8px}
.hearts .ico.lose{animation:blink .4s steps(2) 3}
.chip{display:inline-flex;align-items:center;gap:6px;line-height:16px;font-size:var(--fs-sm)}
#streak{color:var(--flame)}
#streak.off{color:var(--dim)}
#streak.off .ico{filter:grayscale(1) brightness(.6)}
.wal{color:var(--primary)}
.status{background:var(--surface);justify-content:space-between;color:var(--muted);min-height:52px}
.lvl{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm)}
.lvl b{color:var(--text)}
.movebar{display:flex;align-items:center;gap:6px}
.movebar .lbl{font-size:var(--fs-xs);color:var(--muted)}
.movebar .num{display:inline-flex;align-items:baseline;font-size:var(--fs-lg);line-height:1}
.movebar{gap:8px}
#moves{color:var(--success);display:inline-block;transition:transform .1s steps(2)}
.movebar.mid #moves{color:var(--primary)}
.movebar.over #moves{color:var(--danger)}
#moves.bump{transform:scale(1.25)}
.movebar .sep{color:var(--dim)}
#opt{color:var(--text)}
#pips{display:inline-flex;gap:3px;margin-left:4px}
.stage{position:relative;padding:var(--sp);background:#000}
.panel{padding:10px;border-top:2px solid var(--line);min-height:52px;display:flex;align-items:center}
#msg{font-size:var(--fs-xs);line-height:1.9;color:var(--muted)}
#msg.new{color:var(--danger)}
#stars{display:none}
.controls{display:flex;gap:var(--sp);padding:10px;border-top:2px solid var(--line);background:var(--surface-2)}
.controls .btn{flex:1}

/* Icônes pixel */
.spr{display:block;width:88%;height:88%;margin:auto;background:center/100% 100% no-repeat;image-rendering:pixelated}
.ent .spr{width:86%;height:86%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
@keyframes bob{50%{translate:0 -7%}}
@keyframes waddle{0%{scale:1 1;rotate:-4deg}50%{scale:1.06 .94;rotate:0deg;translate:0 -4%}100%{scale:1 1;rotate:4deg}}
#cat .spr{animation:bob .9s steps(2) infinite}
#cat.mv .spr{animation:waddle .28s steps(3) 1}
.agent .spr{animation:bob .7s steps(2) infinite;animation-delay:-.3s}
.agent.alert .spr{animation-duration:.3s;filter:drop-shadow(0 0 4px #FF5A5A) drop-shadow(0 2px 0 rgba(0,0,0,.45))}
#cat.hid .spr{animation:none}
#catSpr.flip{transform:scaleX(-1)}
#home .scene .spr{width:100%;height:100%}
.ico{display:inline-block;width:16px;height:16px;flex:none;background:0 0/100% 100% no-repeat;image-rendering:pixelated;vertical-align:middle}
.ico.lg{width:32px;height:32px}
.ico.off{filter:grayscale(1) brightness(.45)}
.ico.flame{background-image:var(--ico-flame)}
.ico.star{background-image:var(--ico-star)}

/* Boutons */
.btn{font:inherit;font-size:var(--fs-sm);line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:10px 12px;border-radius:0;cursor:pointer;
  background:var(--surface);color:var(--text);border:2px solid var(--line-2);box-shadow:inset 0 -3px 0 #000}
.btn:hover{background:#1C1C1C}
.btn:active{box-shadow:inset 0 3px 0 #000}
.btn:focus-visible{outline:2px dashed var(--primary);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default;background:var(--surface)}
.btn-primary{background:var(--primary);color:var(--primary-ink);border-color:#000;box-shadow:inset 0 -4px 0 var(--primary-dk), inset 0 2px 0 rgba(255,255,255,.4)}
.btn-primary:hover{background:#FFDD7A}
.btn-primary:active{box-shadow:inset 0 3px 0 var(--primary-dk)}
.btn-primary:disabled{background:var(--primary)}
.btn-danger{color:var(--danger);border-color:#4A1C1C}
.btn-sm{min-height:32px;padding:6px 10px;font-size:var(--fs-xs)}
.btn-icon{min-height:32px;min-width:32px;padding:0}
.btn-icon:disabled{opacity:.25}
.btn.done{color:var(--success);border-color:#2F5A2F}
.btn[hidden]{display:none}

/* Fenêtres modales */
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.82);z-index:5;animation:fadein .2s steps(3)}
.modal[hidden]{display:none}
.modal .box{touch-action:pan-y;width:88%;max-width:300px;max-height:94%;overflow:auto;background:var(--surface);border:2px solid var(--line-2);
  padding:16px 14px;text-align:center;display:flex;flex-direction:column;gap:10px}
.modal h2{margin:0 0 2px;font-size:var(--fs-lg);font-weight:400}
.modal p{margin:0;font-size:var(--fs-xs);line-height:1.8;color:var(--muted)}
.modal small{font-size:var(--fs-xs);line-height:1.8;color:var(--muted)}
.modal small:empty{display:none}
.modal .actions{display:flex;flex-direction:column;gap:var(--sp);margin-top:4px}
#win h2{color:var(--success)}
#caught h2{color:var(--danger);animation:blink .5s steps(2) 3}
#shop{z-index:6}
#shop h2{color:var(--primary)}
.wstars{display:flex;justify-content:center;gap:8px;animation:pop2 .4s steps(4)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp)}
.tile{border:2px solid var(--line);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tile b{font-size:var(--fs-lg);color:var(--text)}
.tile span{font-size:var(--fs-xs);color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.tile i{font-style:normal}
#wExtra{color:var(--flame)}
.shopbox{max-width:340px;gap:12px;text-align:left}
.shophead{display:flex;align-items:center;justify-content:space-between}
.shophead h2{margin:0}
.balance{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:2px solid var(--primary-dk);background:#1A1608;color:var(--primary);font-size:var(--fs-md)}
.shopsec{font-size:var(--fs-xs);color:var(--dim);letter-spacing:1px;border-bottom:2px solid var(--line);padding-bottom:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);background:var(--surface-2)}
.item .ic{width:36px;height:36px;position:relative;flex:none}
.item .ic .count{position:absolute;right:-4px;bottom:-4px;font-size:var(--fs-xs);background:#000;border:2px solid var(--line-2);padding:2px 3px;color:var(--text)}
.item .tx{flex:1;font-size:var(--fs-xs);line-height:1.7;color:var(--muted)}
.item .tx b{display:block;color:var(--text);font-size:var(--fs-sm);margin-bottom:4px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px;border:2px solid var(--line);background:var(--surface-2);text-align:center}
.card .ic{width:44px;height:44px;display:grid;place-items:center}
.card b{font-size:var(--fs-xs);color:var(--text);line-height:1.5;min-height:2.6em;display:flex;align-items:center}
.card .btn{width:100%}
.card.on{border-color:var(--success);background:#0F1A10}
.card.locked .ic{filter:grayscale(1) brightness(.5)}
.price{display:inline-flex;align-items:center;gap:4px}
.btn-locked{background:var(--surface);color:var(--dim);border-color:var(--line);cursor:default;box-shadow:none}
.btn-locked:hover{background:var(--surface)}
.btn-locked .ico{filter:grayscale(1) brightness(.5)}
.btn-primary .ico.star{filter:brightness(0) opacity(.8)}
.btn-tag{background:transparent;color:var(--success);border-color:transparent;box-shadow:none;cursor:default}
.btn-tag:hover{background:transparent}

/* Accueil */
#home{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;text-align:center}
#home[hidden]{display:none}
#home .scene{position:relative;width:200px;height:60px;margin:0 auto 18px;border-bottom:4px solid #6E451F;
  background:repeating-linear-gradient(90deg,#3A2410 0 14px,#2E1C0C 14px 16px)}
#home .scene > span{position:absolute;bottom:4px;width:36px;height:36px}
#homeCat{animation:run 2.6s steps(10) infinite}
#home .cop{animation:chase 2.6s steps(10) infinite}
@keyframes run{0%{left:22%}80%,100%{left:66%}}
@keyframes chase{0%{left:0%}80%,100%{left:40%}}
#home h1{margin:0;font-size:var(--fs-xl);font-weight:400;line-height:1.4;color:var(--primary);text-shadow:4px 4px 0 #6E451F}
#home p{margin:10px 0 0;font-size:var(--fs-xs);color:var(--muted);line-height:1.8}
.hstats{display:flex;gap:var(--sp);width:100%;max-width:300px}
.hstats .tile{flex:1;gap:8px;padding:10px 4px}
.hstats .tl{font-size:var(--fs-xs);color:var(--dim);letter-spacing:1px}
.hstats b{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-lg)}
.hstats b .sep{color:var(--dim)}
.hstats .tile > span:last-child{font-size:var(--fs-xs);color:var(--muted)}
#hPlay{flex-direction:column;gap:6px;min-height:58px}
#hPlay span{font-size:var(--fs-lg)}
#hPlay small{font-size:var(--fs-xs);color:#5A4410}
.hrow{display:flex;gap:var(--sp)}
.hrow .btn{flex:1;flex-direction:column;gap:6px}
#hDaily{border-color:var(--primary-dk);color:var(--primary)}
#hDaily.done{border-color:#2F5A2F;color:var(--success)}
#home .scene{width:240px}
#home .scene .hbasket{position:absolute;right:4px;bottom:4px;width:34px;height:34px;background:var(--sp-exit-forest) center/100% 100% no-repeat;image-rendering:pixelated}
.hbtns{display:flex;flex-direction:column;gap:var(--sp);width:100%;max-width:300px}
.hbtns .btn{min-height:46px}
#home small{font-size:var(--fs-xs);color:var(--dim);line-height:1.8;max-width:280px}
#hAdmin{display:flex;gap:var(--sp);width:100%;max-width:300px}
#hAdmin[hidden]{display:none}
#hAdmin input{flex:1;min-width:0;font:inherit;font-size:var(--fs-md);color:var(--text);background:var(--surface-2);border:2px solid var(--primary-dk);padding:10px;border-radius:0;text-align:center}
#hAdmin .btn{flex:none}

/* Plateau */
#board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);touch-action:none;user-select:none}
#board{box-shadow:0 0 0 3px #5A3A1A,0 0 0 5px #000}
#board.th2{box-shadow:0 0 0 3px #3A4654,0 0 0 5px #000}
#board.daily{outline:2px solid var(--primary);outline-offset:2px}
#board.flash{outline:4px solid var(--danger)}
.c{aspect-ratio:1;position:relative;background:var(--fl) 0 0/100% 100%;image-rendering:pixelated}
.c.alt{background:var(--fl-alt) 0 0/100% 100%}
.c.sight::after{content:"";position:absolute;inset:0;background:var(--sight)}
.c.sight.hot::after{background:var(--alert)}
.c.hear::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,90,90,.22) 0 3px,transparent 3px 7px)}
.c.crate{background:var(--sp-pine) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
.c.crate2{background:var(--sp-log) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
.c.barrel{background:var(--sp-rock) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
.c.plant{background:var(--sp-bush) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
.c.hide{background:var(--sp-tent) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
.c.alt.crate{background:var(--sp-pine) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
.c.alt.crate2{background:var(--sp-log) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
.c.alt.barrel{background:var(--sp-rock) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
.c.alt.plant{background:var(--sp-bush) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
.c.alt.hide{background:var(--sp-tent) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
#board.th2{--fl:var(--sp-dock);--fl-alt:var(--sp-dock-alt)}
#board.th2 .c.crate{background:var(--sp-cont-red) 0 0/100% 100%}
#board.th2 .c.crate2{background:var(--sp-cont-blue) 0 0/100% 100%}
#board.th2 .c.barrel{background:var(--sp-drum) 0 0/100% 100%, var(--fl)}
#board.th2 .c.plant{background:var(--sp-crate2) 0 0/100% 100%}
#board.th2 .c.hide{background:var(--sp-obin) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
#board.th2 .c.alt.hide{background:var(--sp-obin) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
#board.th3{--fl:var(--sp-wfloor);--fl-alt:var(--sp-wfloor-alt)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #board.th3{--fl:var(--sp-wfloor-dark);--fl-alt:var(--sp-wfloor-dark-alt)}}
:root[data-theme="dark"] #board.th3{--fl:var(--sp-wfloor-dark);--fl-alt:var(--sp-wfloor-dark-alt)}
#board.th3 .c.crate{background:var(--sp-crate) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
#board.th3 .c.crate2{background:var(--sp-crate2) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
#board.th3 .c.barrel{background:var(--sp-barrel) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
#board.th3 .c.plant{background:var(--sp-plant) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
#board.th3 .c.hide{background:var(--sp-obox) 0 0/100% 100%, var(--fl) 0 0/100% 100%}
#board.th3 .c.alt.crate{background:var(--sp-crate) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
#board.th3 .c.alt.crate2{background:var(--sp-crate2) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
#board.th3 .c.alt.barrel{background:var(--sp-barrel) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
#board.th3 .c.alt.plant{background:var(--sp-plant) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
#board.th3 .c.alt.hide{background:var(--sp-obox) 0 0/100% 100%, var(--fl-alt) 0 0/100% 100%}
#board.th3 #cat.hid::after{background-image:var(--sp-eyes-box)}
#board.th2::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,20,.45))}
.c.nb{cursor:pointer}
.c.nb::before{content:"";position:absolute;inset:3px;border:2px dashed rgba(255,255,255,.75);z-index:1}
.c.nb:hover::before{background:rgba(255,255,255,.25)}
.ent{position:absolute;left:0;top:0;width:12.5%;height:10%;display:grid;place-items:center;
  font-size:clamp(1rem,5.2vw,1.6rem);pointer-events:none;transition:transform .14s steps(3);z-index:2}
#basket{z-index:1;background:var(--sp-exit-forest) center/100% 100% no-repeat}
#basket::before{content:"";position:absolute;inset:0;background:var(--sp-exit-forest-b) center/100% 100% no-repeat;opacity:0;pointer-events:none;animation:exitblink 1.2s steps(1) infinite}
@keyframes exitblink{50%{opacity:1}}
#board.th2 #basket{background-image:var(--sp-exit-sewer)}
#board.th2 #basket::before{background-image:var(--sp-exit-sewer-b)}
#board.th3 #basket{background-image:var(--sp-exit-hatch)}
#board.th3 #basket::before{background-image:var(--sp-exit-hatch-b)}
.agent{z-index:3}
.agent .bubble{position:absolute;top:-30%;right:-5%;font-size:var(--fs-sm);background:#fff;color:#C4302B;border:2px solid #000;padding:2px 4px;display:none}
.agent.alert .bubble{display:block}
#cat.caught{animation:shake .3s steps(4) 2}
#cat.hid .spr{opacity:0}

<script>
const MAX_LEVEL = 30;
const THEME_ORDER = ['forest', 'port', 'warehouse'];
const themeOf = lv => THEME_ORDER[Math.floor((lv - 1) / 10) % 3];
const musicOf = lv => themeOf(lv);
const PLACE = { forest: 'LA FORÊT', port: 'PORT DE NUIT', warehouse: 'ENTREPÔT' };
const OBST = {
  forest: [['crate'],['crate'],['crate','barrel'],['crate','barrel'],['crate'],['crate','plant'],['barrel','plant'],['crate','crate2'],['barrel','crate2'],['crate','plant']],
  port: [['crate'],['crate'],['crate','crate2'],['crate','crate2'],['crate2'],['crate','barrel'],['crate2','barrel'],['crate','plant'],['crate2','plant'],['barrel','plant']],
  warehouse: [['crate'],['crate'],['crate','barrel'],['crate','barrel'],['barrel'],['crate','plant'],['barrel','plant'],['crate','crate2'],['barrel','crate2'],['plant','crate2']]
};
function blockClassGrid(lv, Lv) {
  const pal = OBST[themeOf(lv)][(lv - 1) % 10]; let i = 0;
  return Lv.block.map(row => row.map(k => { if (!k) return ''; const cls = (pal[1] && i % 3 === 1) ? pal[1] : pal[0]; i++; return cls; }));
}
const W = 8, H = 10;
const DIRS = [[-1,0],[0,1],[1,0],[0,-1]];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const inb=(r,c)=>r>=0&&c>=0&&r<H&&c<W;
function sees(L,a,b){
  if(Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])>SIGHT)return false;
  if(a[0]===b[0]){const r=a[0];const[x,y]=a[1]<b[1]?[a[1],b[1]]:[b[1],a[1]];for(let c=x+1;c<y;c++)if(L.block[r][c])return false;return true;}
  if(a[1]===b[1]){const c=a[1];const[x,y]=a[0]<b[0]?[a[0],b[0]]:[b[0],a[0]];for(let r=x+1;r<y;r++)if(L.block[r][c])return false;return true;}
  return false;
}
const near=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])<=1;
function chaseStep(L,from,to){
  const dist=Array.from({length:H},()=>Array(W).fill(-1));
  const q=[to];dist[to[0]][to[1]]=0;
  while(q.length){const[r,c]=q.shift();for(const[dr,dc]of DIRS){const nr=r+dr,nc=c+dc;if(inb(nr,nc)&&!L.block[nr][nc]&&dist[nr][nc]<0&&!(nr===L.basket[0]&&nc===L.basket[1])){dist[nr][nc]=dist[r][c]+1;q.push([nr,nc]);}}}
  let best=from,bd=dist[from[0]][from[1]];
  for(const[dr,dc]of DIRS){const nr=from[0]+dr,nc=from[1]+dc;if(inb(nr,nc)&&dist[nr][nc]>=0&&(bd<0||dist[nr][nc]<bd)){bd=dist[nr][nc];best=[nr,nc];}}
  return best;
}
// state: {cat, ags:[{p,pi,pd,alert}], res}
function step(L,s,d){
  const nr=s.cat[0]+DIRS[d][0],nc=s.cat[1]+DIRS[d][1];
  if(!inb(nr,nc)||L.block[nr][nc])return null;
  const cat=[nr,nc];const hid=L.hide[nr][nc];
  const n={cat,ags:s.ags,res:null};
  if(nr===L.basket[0]&&nc===L.basket[1]){n.res='win';return n;}
  if(s.ags.some(a=>near(cat,a.p))){n.res='lose';return n;}
  n.ags=s.ags.map((a,i)=>{
    let alert=a.alert||(!hid&&(sees(L,a.p,cat)||hears(a.p,cat)));let p,pi=a.pi,pd=a.pd;
    if(alert)p=chaseStep(L,a.p,cat);
    else{const P=L.patrols[i];pi=a.pi+a.pd;if(pi<0||pi>=P.length){pd=-a.pd;pi=a.pi+pd;}p=P[pi];}
    if(!alert&&!hid&&(sees(L,p,cat)||hears(p,cat)))alert=true;
    return{p,pi,pd,alert};
  });
  if(n.ags.some(a=>near(cat,a.p)))n.res='lose';
  return n;
}
const skey=s=>s.cat+'|'+s.ags.map(a=>a.p+(a.alert?'A':a.pi+','+a.pd)).join('|');
function solve(L,max=24){
  const s0=L.start();const seen=new Set([skey(s0)]);let fr=[s0];
  for(let depth=1;depth<=max;depth++){const nx=[];
    for(const s of fr)for(let d=0;d<4;d++){const n=step(L,s,d);if(!n)continue;if(n.res==='win')return depth;if(n.res==='lose')continue;const k=skey(n);if(!seen.has(k)){seen.add(k);nx.push(n);}}
    if(!nx.length)return -1;fr=nx;}
  return -1;
}
function plainDist(L){const s=L.catStart,g=L.basket;const dist=Array.from({length:H},()=>Array(W).fill(-1));const q=[s];dist[s[0]][s[1]]=0;while(q.length){const[r,c]=q.shift();if(r===g[0]&&c===g[1])return dist[r][c];for(const[dr,dc]of DIRS){const nr=r+dr,nc=c+dc;if(inb(nr,nc)&&!L.block[nr][nc]&&dist[nr][nc]<0){dist[nr][nc]=dist[r][c]+1;q.push([nr,nc]);}}}return -1;}

const SIGHT = 3, HEAR = 2;
const hears=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])<=HEAR;
function isBreather(level){return level>=5&&level%5===0;}
function params(level){
  let optMin,agents,detour;
  if(level<=3){optMin=4+level;agents=1;detour=0;}
  else if(isBreather(level)){optMin=6;agents=1;detour=0;}
  else if(level<=9){optMin=7+Math.floor((level-4)/2);agents=1;detour=1;}
  else if(level<=19){optMin=10+Math.floor((level-10)/3);agents=level%2?2:1;detour=2;}
  else{optMin=Math.min(13+Math.floor((level-20)/4),15);agents=2;detour=2;}
  return{optMin,optMax:optMin+2,agents,detour,hides:(level>=20?2:1),mMin:Math.max(3,optMin-4),mMax:Math.min(14,optMin)};
}
function genOne(rng,P){
  const block=Array.from({length:H},()=>Array(W).fill(0));
  const pieces=7+Math.floor(rng()*4);
  for(let i=0;i<pieces;i++){
    const shapes=[[1,1],[1,2],[2,1],[2,2],[1,3],[3,1]];const[h,w]=shapes[Math.floor(rng()*shapes.length)];
    const r=Math.floor(rng()*(H-h+1)),c=Math.floor(rng()*(W-w+1));const k=1+Math.floor(rng()*4);
    for(let a=0;a<h;a++)for(let b=0;b<w;b++)block[r+a][c+b]=k;
  }
  let catStart,basket,ok=false;
  for(let t=0;t<60;t++){catStart=[Math.floor(rng()*H),Math.floor(rng()*W)];basket=[Math.floor(rng()*H),Math.floor(rng()*W)];
    const m=Math.abs(catStart[0]-basket[0])+Math.abs(catStart[1]-basket[1]);if(m>=P.mMin&&m<=P.mMax){ok=true;break;}}
  if(!ok)return null;
  block[catStart[0]][catStart[1]]=0;block[basket[0]][basket[1]]=0;
  const patrols=[];
  for(let a=0;a<P.agents;a++){
    let patrol=null;
    for(let t=0;t<40&&!patrol;t++){
      const horiz=rng()<.55,len=3+Math.floor(rng()*3);
      const r=Math.floor(rng()*H),c=Math.floor(rng()*W);
      const seg=[];for(let i=0;i<len;i++){const rr=horiz?r:r+i,cc=horiz?c+i:c;if(!inb(rr,cc)||block[rr][cc]||(rr===basket[0]&&cc===basket[1]))break;seg.push([rr,cc]);}
      if(seg.length>=3&&!patrols.some(p=>p.some(x=>seg.some(y=>near(x,y)))))patrol=seg;
    }
    if(!patrol)return null;patrols.push(patrol);
  }
  const L={block,basket,catStart,patrols,hide:Array.from({length:H},()=>Array(W).fill(0))};
  L.start=()=>({cat:L.catStart,ags:L.patrols.map(p=>({p:p[0],pi:0,pd:1,alert:false})),res:null});
  const s0=L.start();
  if(s0.ags.some(a=>Math.abs(a.p[0]-s0.cat[0])+Math.abs(a.p[1]-s0.cat[1])<4||sees(L,a.p,s0.cat)))return null;
  if(P.hides){
    const pc=patrols.flat(),cands=[],anyc=[];
    for(let r=0;r<H;r++)for(let c=0;c<W;c++){
      if(block[r][c]||(r===catStart[0]&&c===catStart[1])||(r===basket[0]&&c===basket[1]))continue;
      if(pc.some(q=>Math.abs(q[0]-r)+Math.abs(q[1]-c)<2))continue;
      if(r<Math.min(catStart[0],basket[0])-1||r>Math.max(catStart[0],basket[0])+1||c<Math.min(catStart[1],basket[1])-1||c>Math.max(catStart[1],basket[1])+1)continue;
      anyc.push([r,c]);
      if(pc.some(q=>sees(L,q,[r,c])||hears(q,[r,c])))cands.push([r,c]);
    }
    let placed=0;
    for(;placed<P.hides&&cands.length;placed++){const k=Math.floor(rng()*cands.length);const[r,c]=cands.splice(k,1)[0];L.hide[r][c]=1;}
    for(;placed<P.hides&&anyc.length;placed++){const k=Math.floor(rng()*anyc.length);const[r,c]=anyc.splice(k,1)[0];if(L.hide[r][c]){placed--;continue;}L.hide[r][c]=1;}
    if(placed<P.hides){
      const fr=[];for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(!block[r][c]&&!L.hide[r][c]&&!(r===catStart[0]&&c===catStart[1])&&!(r===basket[0]&&c===basket[1]))fr.push([r,c]);
      for(;placed<P.hides&&fr.length;placed++){const k=Math.floor(rng()*fr.length);const[r,c]=fr.splice(k,1)[0];L.hide[r][c]=1;}
    }
  }
  return L;
}
function hideMatters(L,opt){
  const L2=Object.assign({},L,{hide:Array.from({length:H},()=>Array(W).fill(0))});
  return solve(L2,opt)<0;
}
function generate(level,seed,noHide){
  const P=params(level);if(noHide)P.hides=0;
  const need=level>=6&&!isBreather(level);
  const rng=mulberry32(seed!==undefined?seed:level*7919+13);let fb=null,fb2=null;
  for(let t=0;t<4000;t++){
    const L=genOne(rng,P);if(!L)continue;
    const pd=plainDist(L);if(pd<0||pd>P.optMax)continue;
    const opt=solve(L,P.optMax+1);if(opt<0)continue;
    L.opt=opt;
    if(opt>=P.optMin&&opt<=P.optMax&&opt>=pd+P.detour){
      if(!need||!P.hides||hideMatters(L,opt))return L;
      if(!fb2)fb2=L;
    }
    if(!fb&&opt>=P.optMin-1)fb=L;
    if(fb2&&t>=150)return fb2;
  }
  return fb2||fb||(P.hides?generate(level,seed,true):null);
}

const board = document.getElementById('board'), msg = document.getElementById('msg'), starsEl = document.getElementById('stars');
const catEl = document.getElementById('cat'), basketEl = document.getElementById('basket');
const goBtn = document.getElementById('go');
let L, level, state, hist, moves, over, cells = [], agEls = [];
let save = { max: 1, stars: {}, spent: 0 };
const SAVE_KEY = 'cc-save-v2';
try { localStorage.removeItem('cc-save'); } catch(e) {}
try { save = JSON.parse(localStorage.getItem(SAVE_KEY)) || save; } catch(e) {}
save.max = Math.min(save.max || 1, MAX_LEVEL);

const put = (el, [r, c]) => el.style.transform = `translate(${c * 100}%, ${r * 100}%)`;
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const PAR_MARGIN = 2, MAX_STARS = 2;
const par = () => L.opt + PAR_MARGIN;
const starsFor = m => m < par() ? 2 : m === par() ? 1 : 0;
const starIcons = (n, lg) => [0,1].map(i => `<i class="ico star${lg ? ' lg' : ''}${i < n ? '' : ' off'}"></i>`).join('');

function intro(lv) {
  if (lv === 1) return 'Touche n\'importe où pour guider le chat vers ce côté, ou glisse le doigt. Sous l\'objectif : 2★. Pile dessus : 1★. Au-dessus : 0★.';
  if (lv === 2) return 'Rouge : ce que voit l\'agent. Hachuré : ce qu\'il entend (2 cases). Ne passe pas trop près ! Dans une cachette, il ne te voit plus (sauf s\'il te poursuit déjà).';
  if (lv === 4) return 'Les chemins deviennent plus longs. Observe la ronde avant de bouger.';
  if (lv === 11) return 'Nouveau décor : le port de nuit. Les cachettes deviennent des poubelles, et deux agents patrouillent !';
  if (lv === 21) return 'Nouveau décor : l\'entrepôt. Les cachettes sont des cartons. Dernière ligne droite !';
  if (isBreather(lv)) return 'Niveau repos. Souffle un peu.';
  return 'Mène le chat à la sortie sans te faire attraper.';
}

/* ===== Sons 8-bit (synthétisés, aucun fichier) ===== */
let actx = null;
function audio() {
  if (save.mute) return null;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch(e) { return null; }
  return actx;
}
function tone(freq, start, dur, type = 'square', vol = .08, slideTo) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(start, dur, vol = .06) {
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(), g = a.createGain(), t = a.currentTime + start;
  src.buffer = buf; g.gain.value = vol; src.connect(g).connect(a.destination); src.start(t);
}
const SFX = {
  step:   () => { tone(520 + Math.random() * 60, 0, .05, 'square', .05); },
  bump:   () => { tone(120, 0, .09, 'square', .06, 80); },
  click:  () => { tone(880, 0, .03, 'square', .04); },
  alert:  () => { tone(988, 0, .08, 'square', .07); tone(988, .12, .08, 'square', .07); tone(1318, .24, .14, 'square', .07); },
  caught: () => { noise(0, .15, .08); tone(440, .05, .15, 'sawtooth', .07, 330); tone(330, .22, .15, 'sawtooth', .07, 220); tone(220, .4, .35, 'sawtooth', .07, 110); },
  win:    () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .12, 'square', .07)); tone(1047, .4, .3, 'triangle', .08); },
  star:   () => { tone(1568, 0, .08, 'square', .05); tone(2093, .06, .12, 'square', .05); },
  coin:   () => { tone(988, 0, .07, 'square', .06); tone(1319, .07, .2, 'square', .06); },
  shield: () => { tone(392, 0, .1, 'triangle', .08, 784); tone(784, .1, .2, 'triangle', .08, 1175); },
  start:  () => { tone(392, 0, .08, 'square', .05); tone(523, .09, .12, 'square', .05); },
  hide:   () => { tone(330, 0, .07, 'triangle', .06, 200); tone(220, .07, .1, 'triangle', .05, 150); },
  denied: () => { tone(200, 0, .08, 'square', .05); tone(150, .09, .12, 'square', .05); }

function sightCells(p) {

  }

}

  const out = [];
  for (let dr = -HEAR; dr <= HEAR; dr++) for (let dc = -HEAR; dc <= HEAR; dc++) {
    const r = p[0] + dr, c = p[1] + dc;
    if ((dr || dc) && Math.abs(dr) + Math.abs(dc) <= HEAR && inb(r, c) && !L.block[r][c]) out.push(r * W + c);

}

    const lastLvl = !daily && level >= MAX_LEVEL;
    document.getElementById('wNext').textContent = daily ? 'Retour aux niveaux' : (lastLvl ? 'Retour à l\'accueil' : 'Niveau suivant ▶');
    if (lastLvl) { document.getElementById('wTitle').textContent = 'CHAT LIBRE !'; document.getElementById('wExtra').textContent = (extra.trim() + ' Tu as terminé les ' + MAX_LEVEL + ' niveaux. La suite arrive bientôt !').trim(); }
    sfx('win'); buzz(40); stopMusic();
    setTimeout(() => { winEl.hidden = false; document.getElementById('wNext').focus(); for (let i = 0; i < st; i++) setTimeout(() => sfx('star'), 250 + i * 180); }, 450);
  } else if (n.res === 'lose') {
    catEl.classList.add('caught'); board.classList.add('flash'); sfx('caught'); buzz([120, 60, 200]); stopMusic();
    msg.textContent = 'Attrapé par la fourrière !';
    if (daily) msg.textContent = 'Attrapé ! En défi, tu peux recommencer gratuitement.';
    else setTimeout(showCaught, 650);
  } else if (n.ags.some(a => a.alert) && !wasAlert) {
    msg.textContent = 'Repéré ! Il te poursuit.'; sfx('alert'); buzz(60);
  } else if (L.hide[n.cat[0]][n.cat[1]] && !wasHid) {
    sfx('hide'); msg.textContent = 'Caché ! Les agents ne te voient plus.';
  }
}

document.getElementById('undo').addEventListener('click', () => {
  if (!hist.length || state.res === 'lose') return;
  state = hist.pop(); moves--; over = false;
  catEl.classList.remove('caught', 'home'); board.classList.remove('flash');
  msg.textContent = state.ags.some(a => a.alert) ? 'Il te poursuit toujours.' : 'Coup annulé.';
  draw();
});
document.getElementById('restart').addEventListener('click', () => { if (daily || state.res !== 'lose') reset(); });
document.getElementById('daily').addEventListener('click', () => { if (!daily && state.res === 'lose') return; daily ? loadLevel(save.max) : loadDaily(); });
document.getElementById('shopBtn').addEventListener('click', () => { if (state.res === 'lose' && !daily) return; renderShop(); shopEl.hidden = false; });
document.getElementById('shopClose').addEventListener('click', () => { shopEl.hidden = true; if (fromHome) { fromHome = false; showHome(); } });
let fromHome = false;
const homeEl = document.getElementById('home');
const TIPS = ['Astuce : les arbres, rochers et buissons bloquent la vue des agents.', 'Astuce : fais moins de coups que l\'objectif pour gagner 2★.', 'Astuce : la série de jours rapporte jusqu\'à 7★ par jour.', 'Astuce : en défi du jour, perdre est gratuit.', 'Astuce : tu as 3 chances par niveau. Un bouclier en rajoute une.'];
function showHome() {
  stopTimer();
  const st = streakNow();
  document.getElementById('hStreak').textContent = st;
  document.getElementById('hStreakTx').textContent = st > 1 ? 'jours de suite' : 'jour de suite';
  document.getElementById('hStars').textContent = wallet();
  document.getElementById('hCats').textContent = owned().length;
  document.getElementById('hCatsMax').textContent = SKINS.length;
  document.getElementById('hPlay').firstElementChild.textContent = save.max > 1 ? 'Continuer' : 'Jouer';
  document.getElementById('hPlaySub').textContent = `Niveau ${save.max}`;
  const hd = document.getElementById('hDaily'), done = save.dailyDone === dayNum;
  hd.innerHTML = done ? '<span>Défi du jour</span><span class="price">Réussi <i class="ico check"></i></span>' : '<span>Défi du jour</span><span class="price">+5 <i class="ico star"></i></span>';
  hd.classList.toggle('done', done);
  document.getElementById('homeCatSpr').style.backgroundImage = skinBg(save.skin || 0);
  document.getElementById('hTip').textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
  document.getElementById('hAdmin').hidden = !save.admin;
  homeEl.hidden = false;
}
document.getElementById('hGo').addEventListener('click', () => {
  const n = Math.max(1, Math.min(MAX_LEVEL, parseInt(document.getElementById('hLevel').value, 10) || 1));
  homeEl.hidden = true; loadLevel(n);
});
let adminTaps = 0, adminAt = 0;
document.querySelector('#home h1').addEventListener('click', () => {
  const t = Date.now(); adminTaps = (t - adminAt < 1500) ? adminTaps + 1 : 1; adminAt = t;
  if (adminTaps >= 5) {
    adminTaps = 0; save.admin = !save.admin; persist(); showHome();
    document.getElementById('hTip').textContent = save.admin ? 'Mode admin activé : tous les niveaux sont accessibles, rien n\'est enregistré.' : 'Mode admin désactivé.';
  }
});
document.getElementById('hPlay').addEventListener('click', () => { homeEl.hidden = true; loadLevel(save.max); });
document.getElementById('hDaily').addEventListener('click', () => { homeEl.hidden = true; loadDaily(); });
document.getElementById('hShop').addEventListener('click', () => { homeEl.hidden = true; fromHome = true; renderShop(); shopEl.hidden = false; });
document.getElementById('homeBtn').addEventListener('click', () => { if (state && state.res === 'lose' && !daily) return; shopEl.hidden = true; showHome(); });
document.getElementById('shield').addEventListener('click', () => {
  if (!(save.shields > 0)) return;
  sfx('shield'); save.shields--; lives = 1; persist(); caughtEl.hidden = true; reset(); drawLives();
  msg.textContent = `Bouclier utilisé : +1 chance. Il t'en reste ${save.shields}.`;
});
goBtn.addEventListener('click', () => daily ? loadLevel(save.max) : loadLevel(level + 1));
document.getElementById('wNext').addEventListener('click', () => { winEl.hidden = true; if (!daily && level >= MAX_LEVEL) { showHome(); return; } daily ? loadLevel(save.max) : loadLevel(level + 1); });
document.getElementById('wRetry').addEventListener('click', () => { winEl.hidden = true; reset(); });
document.getElementById('prev').addEventListener('click', () => state.res !== 'lose' && level > 1 && loadLevel(level - 1));
document.getElementById('next').addEventListener('click', () => state.res !== 'lose' && (save.admin || level < save.max) && level < MAX_LEVEL && loadLevel(level + 1));
document.addEventListener('keydown', e => {
  const m = { ArrowUp:0, ArrowRight:1, ArrowDown:2, ArrowLeft:3 }[e.key];
  if (e.target.tagName === 'INPUT') { if (e.key === 'Enter') document.getElementById('hGo').click(); return; }
  if (m !== undefined) { e.preventDefault(); move(m); }
});
let tp = null;
function inputBlocked(t) {
  if (!homeEl.hidden || !shopEl.hidden || !winEl.hidden || !caughtEl.hidden) return true;
  return !!(t.closest && t.closest('button, .btn, .modal'));
}
document.addEventListener('pointerdown', e => { tp = inputBlocked(e.target) ? null : { x: e.clientX, y: e.clientY, type: e.pointerType }; });
document.addEventListener('pointercancel', () => { tp = null; });
document.addEventListener('pointerup', e => {
  if (!tp) return;
  const s = tp; tp = null;
  const dx = e.clientX - s.x, dy = e.clientY - s.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) >= 20) { move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)); return; }
  if (s.type === 'mouse') {
    // souris : clic sur une case voisine
    const rect = board.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / rect.width * W), r = Math.floor((e.clientY - rect.top) / rect.height * H);
    if (!inb(r, c)) return;
    const dr = r - state.cat[0], dc = c - state.cat[1];
    const d = dr === -1 && dc === 0 ? 0 : dr === 0 && dc === 1 ? 1 : dr === 1 && dc === 0 ? 2 : dr === 0 && dc === -1 ? 3 : -1;
    if (d >= 0) move(d);
    return;
  }
  // tactile : un toucher n'importe où envoie le chat de ce côté (haut, bas, gauche, droite)
  const rc = catEl.getBoundingClientRect();
  const tx = e.clientX - (rc.left + rc.width / 2), ty = e.clientY - (rc.top + rc.height / 2);
  if (Math.hypot(tx, ty) < rc.width * .3) return;
  move(Math.abs(tx) > Math.abs(ty) ? (tx > 0 ? 1 : 3) : (ty > 0 ? 2 : 0));
});

loadLevel(save.max);
showHome();

document.addEventListener('click', e => {
  const b = e.target.closest('.btn');
  if (!b || b.id === 'soundBtn') return;
  if (b.classList.contains('btn-locked')) sfx('denied');
  else if (!b.disabled && !b.closest('.card,.item')) sfx('click');
});
function drawSound() {
  const i = document.querySelector('#soundBtn .ico');
  i.className = 'ico ' + (save.mute ? 'soff' : 'son');
  document.getElementById('soundBtn').setAttribute('aria-label', save.mute ? 'Activer le son' : 'Couper le son');
}
document.getElementById('soundBtn').addEventListener('click', () => { save.mute = !save.mute; persist(); drawSound(); if (!save.mute) sfx('click'); });
drawSound();
const curTheme = () => homeEl.hidden ? musicOf(level) : 'warehouse';
function drawMusic() {
  document.querySelector('#musicBtn .ico').className = 'ico ' + (save.musicOff ? 'moff' : 'mon');
  document.getElementById('musicBtn').setAttribute('aria-label', save.musicOff ? 'Activer la musique' : 'Couper la musique');
}
document.getElementById('musicBtn').addEventListener('click', () => {
  save.musicOff = !save.musicOff; persist(); drawMusic();
  if (save.musicOff) stopMusic(); else { mus.started = true; startMusic(curTheme()); }
});
// La musique démarre au premier geste (règle des navigateurs)
document.addEventListener('pointerdown', () => {
  if (!mus.started && !save.musicOff) { mus.started = true; startMusic(curTheme()); }
}, { once: false });
drawMusic();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
